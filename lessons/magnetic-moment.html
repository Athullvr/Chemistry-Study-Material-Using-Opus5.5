<script>
(() => {
const { clamp, clamp01, S, Lr, lerp, easeOut, hash, SUP } = Studio.U;
const { INK, GRAY, ORANGE, SANS, MONO } = Studio.C;
const { sk, hatch, hand, arrowSk, softEllipse, sphere, ringFx, tag, ellipsePts, sketchAxes } = Studio.draw;
let ctx, TT, P;                        // set at the start of every draw()

// ------------------------------------------------------------ chemistry
// 3d ions of the first transition series. col = typical colour of the aqueous ion (muted).
const IONS = [
  { name: 'Sc³⁺', sym: 'Sc', Z: 21, q: 3, col: '#e9e6df' }, { name: 'Ti³⁺', sym: 'Ti', Z: 22, q: 3, col: '#b48bb8' },
  { name: 'V³⁺', sym: 'V', Z: 23, q: 3, col: '#7fa37a' }, { name: 'Cr³⁺', sym: 'Cr', Z: 24, q: 3, col: '#7d9483' },
  { name: 'Mn²⁺', sym: 'Mn', Z: 25, q: 2, col: '#ecd9da' }, { name: 'Fe³⁺', sym: 'Fe', Z: 26, q: 3, col: '#c9a45a' },
  { name: 'Fe²⁺', sym: 'Fe', Z: 26, q: 2, col: '#bcd2a9' }, { name: 'Co²⁺', sym: 'Co', Z: 27, q: 2, col: '#d79aa8' },
  { name: 'Ni²⁺', sym: 'Ni', Z: 28, q: 2, col: '#86b287' }, { name: 'Cu²⁺', sym: 'Cu', Z: 29, q: 2, col: '#7ea3cc' },
  { name: 'Cu⁺', sym: 'Cu', Z: 29, q: 1, col: '#e9e6df' }, { name: 'Zn²⁺', sym: 'Zn', Z: 30, q: 2, col: '#e9e6df' },
];
const CO = 7, ZN = 11, MN = 4;
// ground-state atom beyond [Ar]; Cr and Cu are the half-filled / filled exceptions
function atomCfg(Z) {
  if (Z === 24) return { s: 1, d: 5 };
  if (Z === 29) return { s: 1, d: 10 };
  const v = Z - 18; return v <= 2 ? { s: v, d: 0 } : { s: 2, d: v - 2 };
}
// forming the ion: 4s electrons leave first, then 3d
function ionCfg(Z, q) {
  const a = atomCfg(Z); let s = a.s, d = a.d, r = q;
  const rs = Math.min(s, r); s -= rs; r -= rs; d = Math.max(0, d - r);
  return { s, d };
}
const unpairedD = d => d <= 5 ? d : 10 - d;
const muOf = nU => Math.sqrt(nU * (nU + 2));
const sup = n => String(n).split('').map(c => SUP[c]).join('');
const cfgStr = c => '[Ar]' + (c.d ? ' 3d' + sup(c.d) : '') + (c.s ? ' 4s' + sup(c.s) : '');
const ionInfo = i => { const I = IONS[i], c = ionCfg(I.Z, I.q), nU = unpairedD(c.d) + (c.s === 1 ? 1 : 0); return { ...I, cfg: c, atom: atomCfg(I.Z), n: nU, mu: muOf(nU) }; };
const boxStr = d => Array.from({ length: 5 }, (_, j) => (j < d ? '↑' : '') + (j < d - 5 ? '↓' : '') || '_').join('  ');

// order in which the atom's valence electrons are drawn (aufbau: 4s, then 3d by Hund's rule)
function seqFor(c) {
  const out = [];
  if (c.s >= 1) out.push({ box: -1, up: true });
  if (c.s >= 2) out.push({ box: -1, up: false });
  for (let j = 0; j < Math.min(c.d, 5); j++) out.push({ box: j, up: true });
  for (let j = 0; j < c.d - 5; j++) out.push({ box: j, up: false });
  return out;
}
// which of those leave when the ion forms: 4s first (last-in first), then 3d
function removalOrder(seq, q) {
  const idx = seq.map((_, i) => i);
  return [...idx.filter(i => seq[i].box < 0).reverse(), ...idx.filter(i => seq[i].box >= 0).reverse()].slice(0, q);
}
function electrons(ionIdx, fillK, removeK) {
  const I = IONS[ionIdx], seq = seqFor(atomCfg(I.Z)), rem = removalOrder(seq, I.q);
  return seq.map((e, i) => {
    const j = rem.indexOf(i);
    return { ...e, p: clamp01(fillK - i), r: j < 0 ? 0 : clamp01(removeK - j) };
  }).filter(e => e.p > 0);
}
function countUnpaired(els) {
  const cnt = {};
  for (const e of els) if (e.p >= 1 && e.r < 1) cnt[e.box] = (cnt[e.box] || 0) + 1;
  let nU = 0, pairs = 0;
  for (const k in cnt) { if (cnt[k] === 1) nU++; else pairs++; }
  return { nU, pairs };
}

// ------------------------------------------------------------ geometry
const PIV = { x: 360, y: 245 }, ARM = 150;
const BOX = { y: 240, h: 90, w: 70, s: 560, d0: 670 };
const bx = b => b < 0 ? BOX.s + BOX.w / 2 : BOX.d0 + b * BOX.w + BOX.w / 2;
const BY = BOX.y + BOX.h / 2;
function beamEnds(th) {
  const c = Math.cos(th), s = Math.sin(th);
  return { L: [PIV.x - ARM * c, PIV.y - ARM * s], R: [PIV.x + ARM * c, PIV.y + ARM * s] };
}
let tiltS = 0;
const vA = { orbitals: 1, graph: 0, working: 0 };

// ------------------------------------------------------------ small drawing helpers
function harpoon(x, y, up, size, alpha, m, seed) {
  if (alpha <= 0.01) return;
  const b = ctx.globalAlpha, h = size / 2;
  // full arrow (↑ or ↓) so the spin direction reads at a glance
  const d = up ? -1 : 1, tip = [x, y + d * h], tail = [x, y - d * h], bw = size * 0.22, bl = size * 0.28;
  const head = [[x - bw, tip[1] - d * bl], tip, [x + bw, tip[1] - d * bl]];
  if (m < 1) { ctx.globalAlpha = b * alpha * (1 - m * 0.8); sk([tail, tip], seed, 1, { w: 2.2, amp: 0.7 }); sk(head, seed + 2, 1, { w: 2.2, amp: 0.5 }); }
  if (m > 0) {
    ctx.globalAlpha = b * alpha * m;
    ctx.strokeStyle = up ? '#2d2925' : '#3f4a63'; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(...tail); ctx.lineTo(...tip); ctx.moveTo(...head[0]); ctx.lineTo(...tip); ctx.lineTo(...head[2]); ctx.stroke();
  }
  ctx.globalAlpha = b;
}
// vertical bar magnet: N end (muted red) points where the spin arrow points
function barMagnet(x, y, up, len, w, alpha, m, seed) {
  if (alpha <= 0.01) return;
  const b = ctx.globalAlpha, top = y - len / 2;
  const nTop = up;
  if (m < 1) {
    ctx.globalAlpha = b * alpha * (1 - m * 0.8);
    sk([[x - w / 2, top], [x + w / 2, top], [x + w / 2, top + len], [x - w / 2, top + len], [x - w / 2, top]], seed, 1, { w: 1.6, amp: 0.8 });
    sk([[x - w / 2, y], [x + w / 2, y]], seed + 3, 1, { w: 1.2, single: true });
    hand('N', x, (nTop ? top + len * 0.25 : top + len * 0.75) + 7, { size: Math.max(14, w * 0.8), align: 'center', color: ORANGE });
  }
  if (m > 0) {
    ctx.globalAlpha = b * alpha * m;
    softEllipse(x + 6, top + len + 4, w * 0.9, 5, 0.22);
    const half = (y0, col) => {
      const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
      g.addColorStop(0, Studio.U.mix(col, '#000000', 0.18)); g.addColorStop(0.4, Studio.U.mix(col, '#ffffff', 0.25)); g.addColorStop(1, Studio.U.mix(col, '#000000', 0.25));
      ctx.fillStyle = g; ctx.fillRect(x - w / 2, y0, w, len / 2);
    };
    half(top, nTop ? '#b5584a' : '#9aa3ae'); half(y, nTop ? '#9aa3ae' : '#b5584a');
    ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(w * 0.55)}px ${SANS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('N', x, nTop ? top + len * 0.25 : top + len * 0.75);
    ctx.fillStyle = '#2d2925'; ctx.fillText('S', x, nTop ? top + len * 0.75 : top + len * 0.25);
  }
  ctx.globalAlpha = b;
}
function note(t, t0, t1, tOut, fn) {
  if (t < t0 || t > tOut + 0.6) return;
  const b = ctx.globalAlpha; ctx.globalAlpha = b * (1 - S(t, tOut, tOut + 0.6));
  fn(Lr(t, t0, t1)); ctx.globalAlpha = b;
}

// ------------------------------------------------------------ Gouy balance
function drawBalanceSketch(th, ion) {
  const { L, R } = beamEnds(th);
  sk([[110, 800], [610, 800], [610, 852], [110, 852], [110, 800]], 11, P(0.4, 1.0), { w: 2 });
  sk([[140, 812], [330, 812], [330, 842], [140, 842], [140, 812]], 12, P(0.8, 1.1), { w: 1.4 });
  sk([[350, 800], [350, 255], [370, 255], [370, 800]], 13, P(0.9, 1.3), { w: 1.8 });
  sk([L, R], 14, P(1.2, 1.6), { w: 2.4 });
  sk(ellipsePts(PIV.x, PIV.y, 8, 8, 12), 15, P(1.2, 1.6), { w: 1.4 });
  const pp = P(1.5, 2.0), panY = L[1] + 220;
  sk([L, [L[0] - 38, panY], [L[0] + 38, panY], L], 16, pp, { w: 1.3 });
  sk(ellipsePts(L[0], panY, 42, 8, 18), 17, pp, { w: 1.6 });
  sk([[L[0] - 22, panY - 6], [L[0] - 22, panY - 34], [L[0] + 22, panY - 34], [L[0] + 22, panY - 6]], 18, pp, { w: 1.5 });
  const tp = P(2.0, 2.4), tTop = R[1] + 135;
  sk([R, [R[0], tTop]], 19, tp, { w: 1.2 });
  sk([[R[0] - 12, tTop], [R[0] - 12, tTop + 250], [R[0] - 6, tTop + 260], [R[0] + 6, tTop + 260], [R[0] + 12, tTop + 250], [R[0] + 12, tTop]], 20, tp, { w: 1.7 });
  hatch(() => { ctx.beginPath(); ctx.rect(R[0] - 12, tTop + 60, 24, 196); }, R[0] - 12, tTop + 60, R[0] + 12, tTop + 256, 7, 21, tp, 0.35);
  const mp = P(2.2, 3.4);
  sk([[450, 560], [492, 560], [492, 700], [528, 700], [528, 560], [570, 560], [570, 745], [450, 745], [450, 560]], 22, mp, { w: 2 });
  sk([[470, 745], [470, 800]], 23, mp, { w: 1.6 }); sk([[550, 745], [550, 800]], 24, mp, { w: 1.6 });
  for (let i = 0; i < 6; i++) { sk([[444, 596 + i * 14], [498, 596 + i * 14]], 30 + i, mp, { w: 1, single: true, color: '#9a6a44' }); sk([[522, 596 + i * 14], [576, 596 + i * 14]], 40 + i, mp, { w: 1, single: true, color: '#9a6a44' }); }
}
function drawBalanceModel(th, ion, magT) {
  const { L, R } = beamEnds(th), I = IONS[ion];
  softEllipse(380, 858, 280, 16, 0.3);
  // base
  const bg = ctx.createLinearGradient(0, 800, 0, 852); bg.addColorStop(0, '#e9e3d6'); bg.addColorStop(1, '#cfc6b4');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(110, 800, 500, 52, 10); ctx.fill();
  ctx.fillStyle = '#3b3631'; ctx.beginPath(); ctx.roundRect(138, 810, 196, 34, 6); ctx.fill();
  // pillar
  const pg = ctx.createLinearGradient(350, 0, 370, 0); pg.addColorStop(0, '#8d8577'); pg.addColorStop(0.45, '#d8d1c3'); pg.addColorStop(1, '#7d7568');
  ctx.fillStyle = pg; ctx.fillRect(350, 255, 20, 546);
  // magnet: yoke + poles + coils
  const mg = (x0, x1) => { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, '#5b5f66'); g.addColorStop(0.45, '#9aa0a8'); g.addColorStop(1, '#4e525a'); return g; };
  softEllipse(510, 802, 90, 10, 0.25);
  ctx.fillStyle = mg(450, 570); ctx.fillRect(450, 700, 120, 45);
  ctx.fillStyle = mg(450, 492); ctx.fillRect(450, 560, 42, 145);
  ctx.fillStyle = mg(528, 570); ctx.fillRect(528, 560, 42, 145);
  ctx.fillStyle = '#6b6f76'; ctx.fillRect(466, 745, 10, 55); ctx.fillRect(544, 745, 10, 55);
  for (const x0 of [444, 522]) {
    const cg = ctx.createLinearGradient(x0, 0, x0 + 54, 0); cg.addColorStop(0, '#7a3c19'); cg.addColorStop(0.4, '#d9905f'); cg.addColorStop(1, '#6f3415');
    ctx.fillStyle = cg; ctx.fillRect(x0, 592, 54, 84);
    ctx.strokeStyle = 'rgba(60,25,8,0.45)'; ctx.lineWidth = 1;
    for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.moveTo(x0, 596 + i * 7); ctx.lineTo(x0 + 54, 596 + i * 7); ctx.stroke(); }
  }

  if (magT > 0.02) {
    ctx.save(); ctx.globalAlpha *= magT; ctx.setLineDash([4, 5]); ctx.strokeStyle = '#6a5a8a'; ctx.lineWidth = 1.4;
    for (let i = 0; i < 5; i++) { const y = 572 + i * 30; ctx.beginPath(); ctx.moveTo(493, y); ctx.lineTo(527, y); ctx.stroke(); }
    ctx.setLineDash([]); ctx.restore();
  }
  // pan with counterweights
  const panY = L[1] + 220;
  ctx.strokeStyle = '#7d7568'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(...L); ctx.lineTo(L[0] - 38, panY); ctx.moveTo(...L); ctx.lineTo(L[0] + 38, panY); ctx.stroke();
  softEllipse(L[0] + 8, panY + 12, 46, 6, 0.18);
  const pan = ctx.createLinearGradient(L[0] - 42, 0, L[0] + 42, 0); pan.addColorStop(0, '#8d8577'); pan.addColorStop(0.5, '#e3ddd0'); pan.addColorStop(1, '#8d8577');
  ctx.fillStyle = pan; ctx.beginPath(); ctx.ellipse(L[0], panY, 42, 8, 0, 0, Math.PI * 2); ctx.fill();
  for (const [dx, h] of [[-12, 30], [12, 22]]) {
    const wg = ctx.createLinearGradient(L[0] + dx - 10, 0, L[0] + dx + 10, 0); wg.addColorStop(0, '#8a6a2f'); wg.addColorStop(0.45, '#e0c177'); wg.addColorStop(1, '#7a5c26');
    ctx.fillStyle = wg; ctx.fillRect(L[0] + dx - 10, panY - 4 - h, 20, h);
  }
  // sample tube (in front of the magnet)
  const tTop = R[1] + 135;
  ctx.strokeStyle = '#7d7568'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(...R); ctx.lineTo(R[0], tTop); ctx.stroke();
  const tube = () => { ctx.beginPath(); ctx.moveTo(R[0] - 12, tTop); ctx.lineTo(R[0] - 12, tTop + 250); ctx.quadraticCurveTo(R[0] - 12, tTop + 262, R[0], tTop + 262); ctx.quadraticCurveTo(R[0] + 12, tTop + 262, R[0] + 12, tTop + 250); ctx.lineTo(R[0] + 12, tTop); };
  tube(); ctx.fillStyle = 'rgba(230,240,244,0.5)'; ctx.fill();
  ctx.save(); tube(); ctx.clip();
  const lg = ctx.createLinearGradient(R[0] - 12, 0, R[0] + 12, 0);
  lg.addColorStop(0, Studio.U.mix(I.col, '#000000', 0.15)); lg.addColorStop(0.45, I.col); lg.addColorStop(1, Studio.U.mix(I.col, '#000000', 0.2));
  ctx.fillStyle = lg; ctx.fillRect(R[0] - 12, tTop + 60, 24, 210);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(R[0] - 8, tTop + 10, 4, 240);
  ctx.restore();
  tube(); ctx.strokeStyle = 'rgba(95,115,125,0.7)'; ctx.lineWidth = 2; ctx.stroke();
  // beam
  ctx.save(); ctx.translate(PIV.x, PIV.y); ctx.rotate(th);
  const beam = ctx.createLinearGradient(0, -5, 0, 5); beam.addColorStop(0, '#e3ddd0'); beam.addColorStop(1, '#8d8577');
  ctx.fillStyle = beam; ctx.beginPath(); ctx.roundRect(-ARM - 6, -5, ARM * 2 + 12, 10, 4); ctx.fill();
  ctx.restore();
  sphere(PIV.x, PIV.y, 9, '#8d8577', null, { shadow: false });
}
function balanceReading(mu, magT) {
  return 12.4 + magT * (mu > 0 ? 0.004 * mu * mu : -0.0015);
}

// ------------------------------------------------------------ orbital boxes + spin magnets
function drawBoxes(els, m, prog) {
  // 4s box, then five 3d boxes
  const boxes = [[BOX.s, -1], ...[0, 1, 2, 3, 4].map(j => [BOX.d0 + j * BOX.w, j])];
  const b = ctx.globalAlpha;
  if (m > 0) {
    ctx.globalAlpha = b * m;
    for (const [x] of boxes) {
      softEllipse(x + BOX.w / 2 + 4, BOX.y + BOX.h + 6, BOX.w * 0.5, 6, 0.18);
      ctx.fillStyle = '#fffdf8'; ctx.strokeStyle = '#cfc6b4'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(x + 3, BOX.y, BOX.w - 6, BOX.h, 6); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = b;
  }
  ctx.globalAlpha = b * (1 - 0.8 * m);
  boxes.forEach(([x], i) => sk([[x + 3, BOX.y], [x + BOX.w - 3, BOX.y], [x + BOX.w - 3, BOX.y + BOX.h], [x + 3, BOX.y + BOX.h], [x + 3, BOX.y]], 300 + i * 7, prog, { w: 1.7 }));
  ctx.globalAlpha = b;
  hand('4s', bx(-1), BOX.y + BOX.h + 32, { size: 28, align: 'center', color: GRAY, prog });
  hand('3d', bx(2), BOX.y + BOX.h + 32, { size: 28, align: 'center', color: GRAY, prog });
  for (const e of els) {
    const up = e.up, x = bx(e.box) + (up ? -11 : 11);
    const y = lerp(BY - 95, BY, easeOut(e.p)) - 115 * easeOut(e.r);
    const a = e.p * (1 - e.r);
    if (e.r > 0 && e.r < 0.3) ringFx(x, BY, e.r / 0.3, ORANGE);
    harpoon(x, y, up, 50, a, m, 500 + e.box * 13 + (up ? 0 : 5));
  }
}
function drawMagnetRow(nU, pairs, mu, m, a) {
  if (a <= 0.01) return;
  const b = ctx.globalAlpha; ctx.globalAlpha = b * a;
  hand('unpaired spins = little magnets', 660, 500, { size: 26, color: GRAY });
  const shown = Math.min(nU, 5), x0 = 830 - (shown - 1) * 23;
  for (let i = 0; i < shown; i++) barMagnet(x0 + i * 46, 578, true, 70, 22, 1, m, 700 + i * 9);
  if (!shown) hand('no unpaired electrons', 830, 588, { size: 26, color: GRAY, align: 'center' });
  hand(pairs ? `${pairs} pair${pairs > 1 ? 's' : ''} ↑↓ cancel out` : 'no pairs to cancel', 660, 648, { size: 23, color: GRAY });
  hand(`n = ${nU}  →  μ = ${mu.toFixed(2)} BM`, 660, 690, { size: 30, color: ORANGE });
  // μ bar (scale 0–6 BM)
  const w = mu * 55;
  sk([[660, 718], [660 + 6 * 55, 718]], 777, 1, { w: 1, color: GRAY, single: true, dash: [3, 5] });
  if (w > 0) {
    if (m > 0) { const bb = ctx.globalAlpha; ctx.globalAlpha = bb * m; ctx.fillStyle = '#c98a5a'; ctx.beginPath(); ctx.roundRect(660, 712, w, 12, 4); ctx.fill(); ctx.globalAlpha = bb; }
    ctx.globalAlpha = b * a * (1 - 0.8 * m); sk([[660, 712], [660 + w, 712], [660 + w, 724], [660, 724], [660, 712]], 778, 1, { w: 1.4, color: ORANGE }); ctx.globalAlpha = b * a;
  }
  for (const v of [0, 2, 4, 6]) hand(String(v), 660 + v * 55, 746, { size: 17, color: GRAY, align: 'center' });
  ctx.globalAlpha = b;
}
function drawSpinDemo(a, m, clk) {
  if (a <= 0.01) return;
  const b = ctx.globalAlpha; ctx.globalAlpha = b * a;
  hand('why unpaired electrons make a magnet', 660, 470, { size: 28, prog: P(11.4, 12.2) });
  // row 1: spinning electron → tiny magnet
  const r1 = P(11.8, 12.4);
  if (r1 > 0) {
    ctx.globalAlpha = b * a * r1;
    sphere(700, 540, 18, '#d4a24c', 'e⁻', { labelColor: '#4a3310', labelSize: 14 });
    const ang = clk * 3;
    sk(ellipsePts(700, 540, 30, 11, 18, ang, ang + 4.2), 801, 1, { w: 1.6, color: ORANGE, single: true });
    ctx.globalAlpha = b * a;
  }
  arrowSk(740, 540, 800, 540, 803, P(12.4, 12.9), GRAY, 0.05);
  barMagnet(830, 540, true, 70, 22, P(12.8, 13.3), m, 805);
  hand('spinning charge = a tiny magnet', 870, 548, { size: 24, color: ORANGE, prog: P(13.0, 13.8) });
  // row 2: paired

  // row 3: unpaired add
  for (let i = 0; i < 3; i++) barMagnet(700 + i * 36, 735, true, 60, 20, P(15.8 + i * 0.2, 16.2 + i * 0.2), m, 821 + i);
  hand('unpaired ↑ ↑ ↑ → they add up', 820, 743, { size: 24, color: ORANGE, prog: P(16.4, 17.2) });
  hand('→ pulled into a magnetic field: paramagnetic', 660, 795, { size: 24, color: ORANGE, prog: P(17.2, 18.0) });
  ctx.globalAlpha = b;
}

// ------------------------------------------------------------ notebook views
function drawOrbitals(a, ionIdx, ionA) {
  if (a <= 0.01) return;
  const b = ctx.globalAlpha; ctx.globalAlpha = b * a;
  const I = ionInfo(ionIdx);
  hand('which electrons leave first?', 1070, 205, { size: 38, prog: P(19.0, 19.8) });
  const levels = (x0, y3d, y4s, c, label, alpha) => {
    const bb = ctx.globalAlpha; ctx.globalAlpha = bb * alpha;
    hand(label, x0 + 70, 262, { size: 25, color: GRAY, align: 'center' });
    for (let j = 0; j < 5; j++) {
      sk([[x0 + j * 30, y3d], [x0 + j * 30 + 24, y3d]], 900 + x0 + j, 1, { w: 2.4 });

function drawGraph(a, curIdx) {
  if (a <= 0.01) return;

    { xlabel: 'n  (unpaired e⁻)', ylabel: 'μ (BM)', xticks: [0, 1, 2, 3, 4, 5], yticks: [0, 2, 4, 6], seed: 1201 });
  const curve = []; for (let v = 0; v <= 5.3; v += 0.1) curve.push([X(v), Y(muOf(v))]);
  sk(curve, 1210, 1, { w: 1.3, color: GRAY, single: true });
  const cur = ionInfo(curIdx);
  for (let nU = 0; nU <= 5; nU++) {
    const pp = TT === null ? 1 : Lr(TT, 39.6 + nU * 1.2, 40.4 + nU * 1.2);

    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(px, py, 5.5, 0, Math.PI * 2); ctx.fill();
    const right = nU < 4, ny = nU === 0 ? py - 36 : py + 18;

    hand(names, px + (right ? 12 : -12), ny, { size: 17, color: GRAY, align: right ? 'left' : 'right' });
    ctx.globalAlpha = bb;
  }
  const cx = X(cur.n), cy = Y(cur.mu);
  ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#f3f0e8'; ctx.lineWidth = 3; ctx.stroke();
  if (cur.n === 0) hand(cur.name, cx + 14, cy - 64, { size: 28, color: ORANGE }); else hand(cur.name, cx - 16, cy + (cur.n >= 4 ? -44 : -18), { size: 28, color: ORANGE, align: 'right' });

}
function drawWorking(a, ionIdx) {
  if (a <= 0.01) return;
  const b = ctx.globalAlpha; ctx.globalAlpha = b * a;
  const I = ionInfo(ionIdx), X = 1070, sz = 32, n = I.n;
  hand(`Z = ${I.Z} → ${I.sym} : ${cfgStr(I.atom)}`, X, 220, { size: sz, prog: P(32.0, 32.8) });
  hand(`${I.name} : take ${I.q} e⁻ away, 4s first`, X, 272, { size: sz, prog: P(32.8, 33.6) });
  hand(`      → ${cfgStr(I.cfg)}`, X, 316, { size: sz, prog: P(33.6, 34.2) });
  hand(I.cfg.d ? `3d${sup(I.cfg.d)} :  ${boxStr(I.cfg.d)}   n = ${n}` : `no 3d electrons   n = ${n}`, X, 370, { size: sz, prog: P(34.2, 35.0) });
  hand('μ = √(n(n + 2)) BM', X, 438, { size: sz, prog: P(35.2, 35.8) });
  hand(`   = √(${n} × ${n + 2}) = √${n * (n + 2)}`, X, 486, { size: sz, prog: P(35.8, 36.6) });
  const fin = P(36.8, 37.3);
  if (fin > 0) {
    const w = hand(`μ = ${I.mu.toFixed(2)} BM`, X + 20, 575, { size: 50, color: ORANGE, weight: 700, prog: fin });

    : n === 0 ? 'no unpaired electrons → diamagnetic (weakly pushed out)' : `${n} unpaired electron${n > 1 ? 's' : ''} → paramagnetic (pulled in)`;
  hand(nt, X, 660, { size: 21, color: GRAY, prog: P(37.6, 38.2) });
  if (ionIdx === CO) hand('(see the crystal-field lesson for why)', X, 688, { size: 20, color: GRAY, prog: P(37.8, 38.3) });
  ctx.globalAlpha = b;
}
