// ------------------------------------------------------------ chemistry
const R = 8.314, F = 96485, n = 2, E0 = 1.10, EZN = -0.76, ECU = 0.34;
const fac = T => 2.303 * R * T / (n * F);

const eZn = s => EZN + fac(s.T) * Math.log10(s.zn);

const PROBLEM = { zn: 0.001, cu: 0.1, T: 298 };
const norm = c => clamp01((Math.log10(c) + 6) / 6.3);
const ionTarget = c => clamp(Math.round(4 * (Math.log10(c) + 6)), 0, 26);
// discharge: current ∝ E, Cu²⁺ consumed 1:1 with Zn²⁺ produced (equal volumes)
function dischargeStep(s, dt) {
  const E = emf(s);
  if (E <= 0.002) return true;
  s.cu *= Math.exp(-0.012 * E / (s.cu + 4e-4) * dt);
  s.zn = s.total - s.cu;
  return false;
}
const DRAIN = (() => {
  const s = { zn: 0.001, cu: 0.1, T: 298, total: 0.101 }, out = [];
  for (let i = 0; i <= 400; i++) { out.push([s.zn, s.cu]); for (let j = 0; j < 6; j++) dischargeStep(s, 0.02 / 6 * 3.6); }
  return out;
})();
const drainAt = t => DRAIN[clamp(Math.floor((t - 40) / 0.02), 0, 400)];

// ------------------------------------------------------------ geometry
const GEO = {

  R: { x0: 640, x1: 940, rod: 820, leg: 690 },
  top: 470, bot: 840, liq: 562, rodTop: 330, rodBot: 800, legBot: 640,

const WIRE_B = [[290, 324], [290, 170], [525, 390], [525, 266]];
const WIRE_R = [[585, 266], [585, 390], [820, 170], [820, 324]];
const ePath = mkPath([[290, 700], ...bezPts(WIRE_B), [555, 266], ...bezPts(WIRE_R), [820, 700]]);

const bPath = mkPath(bridgePts);
const NE = 22, SPACING = ePath.len / NE;

function ionBlocked(side, x, y) {

}
function makeIons(side, seed) {
  const g = GEO[side], arr = [];

    const x = lerp(g.x0 + 24, g.x1 - 24, hash(seed + k * 2)), y = lerp(GEO.liq + 30, GEO.bot - 24, hash(seed + k * 2 + 1));

}
const IONS = { zn: makeIons('L', 17), cu: makeIons('R', 131) };
let ePhase = 0, bPhase = 0, ballPhase = 0, gxMax = 6, labTrail = [];
const vA = { energy: 1, graph: 0, working: 0 };

// ------------------------------------------------------------ drawing: ions, cell
function ionDraw(x, y, type, a, m) {

  const base = ctx.globalAlpha;
  if (m < 1) {
    ctx.globalAlpha = base * a * (1 - m * 0.85);
    const col = type === 'zn' ? INK : '#2f55c8';

function bodyPath(g, top, inset = 0) {
  const x0 = g.x0 + inset, x1 = g.x1 - inset, b = GEO.bot - inset;
  ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(x0, b - 26); ctx.quadraticCurveTo(x0, b, x0 + 26, b);
  ctx.lineTo(x1 - 26, b); ctx.quadraticCurveTo(x1, b, x1, b - 26); ctx.lineTo(x1, top);
}
function drawSketchCell(st, E) {
  const { L, R } = GEO;
  for (const [g, seed, p] of [[L, 11, P(0.4, 1.4)], [R, 57, P(1.0, 2.0)]]) {

    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
  }
  for (const [g, col] of [[L, `rgba(190,198,206,${0.16 + 0.14 * norm(st.zn)})`], [R, `rgba(58,108,168,${0.12 + 0.36 * norm(st.cu)})`]]) {
    const cx = (g.x0 + g.x1) / 2, w = g.x1 - g.x0;
    const scaleA = k => col.replace(/[\d.]+\)$/, m => (parseFloat(m) * k).toFixed(3) + ')');
    bodyPath(g, GEO.liq, 4); ctx.closePath();
    const gr = ctx.createLinearGradient(g.x0, 0, g.x1, 0);
    gr.addColorStop(0, scaleA(1.4)); gr.addColorStop(0.5, col); gr.addColorStop(1, scaleA(1.5));
    ctx.fillStyle = gr; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, GEO.liq, w / 2 - 4, 12, 0, 0, Math.PI * 2);
    ctx.fillStyle = scaleA(0.7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
}
function drawGlassFront() {

    bodyPath(g, GEO.top); ctx.strokeStyle = 'rgba(95,115,125,0.6)'; ctx.lineWidth = 3; ctx.stroke();

    ctx.strokeStyle = 'rgba(95,115,125,0.45)'; ctx.lineWidth = 1.5;

function drawWiresMeter(E, showReading) {
  const M = GEO.meter;
  for (const [p, col, hi] of [[WIRE_B, '#232323', '#666'], [WIRE_R, '#9e3d34', '#c47a70']]) {

  const body = ctx.createLinearGradient(0, y, 0, y + M.h); body.addColorStop(0, '#f1ece2'); body.addColorStop(1, '#dcd3c3');
  ctx.fillStyle = body; ctx.beginPath(); ctx.roundRect(x, y, M.w, M.h, 18); ctx.fill();

  const lcd = ctx.createLinearGradient(0, y + 20, 0, y + 72); lcd.addColorStop(0, '#c4cfae'); lcd.addColorStop(1, '#a9b692');
  ctx.fillStyle = lcd; ctx.beginPath(); ctx.roundRect(x + 22, y + 20, M.w - 44, 52, 6); ctx.fill();

function drawElectrons(alpha) {

    const [x, y] = ePath.at(i / NE + u0);

    ctx.globalAlpha = base * alpha * (y > GEO.liq - 8 && (Math.abs(x - 290) < 20 || Math.abs(x - 820) < 20) ? 0.5 : 1);

function drawIons(st, m, clk) {
  for (const type of ['zn', 'cu']) for (const p of IONS[type]) {
    if (p.a > 0.01) ionDraw(p.x + 10 * Math.sin(p.f1 * clk + p.p1), p.y + 8 * Math.sin(p.f2 * clk * 1.1 + p.p2), type, p.a, m);
