<script>
(() => {
const { clamp, clamp01, S, Lr, lerp, easeOut, hash } = Studio.U;
const { INK, GRAY, ORANGE, BLUE, SANS, HAND } = Studio.C;
const { sk, hatch, hand, arrowSk, softEllipse, sphere, tag, ellipsePts, sketchAxes } = Studio.draw;
let ctx, TT, P;                          // set at the start of every draw()
const SN1C = '#a8433a';                  // ink colour used for SN1 in charts (SN2 uses BLUE)

// ------------------------------------------------------------ vectors
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = a => { const l = Math.hypot(...a) || 1; return mul(a, 1 / l); };

// ------------------------------------------------------------ chemistry model
// Substituents on the reacting carbon, in slot order (slot 0 = up, 1 = down-front, 2 = down-back).
// For 2-bromobutane: slot 0 ethyl (priority 2), slot 1 methyl (3), slot 2 H (4) → with Br on the left this is (R).
const SUBS = { me: ['H', 'H', 'H'], p: ['Me', 'H', 'H'], s: ['Et', 'Me', 'H'], t: ['Et', 'Me', 'Me'] };
const SUBNAME = { me: 'CH₃Br', p: '1° (CH₃CH₂Br)', s: '2° ((R)-2-bromobutane)', t: '3° (2-bromo-2-methylbutane)' };
const REACT = { me: 'CH₃Br · bromomethane', p: 'CH₃CH₂Br · bromoethane', s: '(R)-2-bromobutane', t: '2-bromo-2-methylbutane' };
const PROD = { me: 'CH₃OH · methanol', p: 'CH₃CH₂OH · ethanol', s: 'butan-2-ol', t: '2-methylbutan-2-ol' };
const EL = { C: { r: 0.36, col: '#4a4541' }, H: { r: 0.23, col: '#e8e2d6' }, Br: { r: 0.52, col: '#8e4a3a' }, O: { r: 0.4, col: '#b0493f' } };

// qualitative preference model (clearly a teaching score, not real kinetics)
const SCORE = { me: [3, -4], p: [2, -2], s: [0, 0], t: [-4, 3] };
function pSN2(l) {
  if (l.sub === 't') return 0;            // back side completely blocked
  if (l.sub === 'me') return 1;           // CH₃⁺ far too unstable
  let s2 = SCORE[l.sub][0], s1 = SCORE[l.sub][1];
  if (l.nu === 'strong') s2 += 2.5; else { s2 -= 1; s1 += 1; }
  if (l.solv === 'aprotic') { s2 += 1.5; s1 -= 0.5; } else { s2 -= 0.3; s1 += 1; }
  return 1 / (1 + Math.exp(-0.9 * (s2 - s1)));
}
const predicted = l => pSN2(l) >= 0.5 ? 'SN2' : 'SN1';
const nuTxt = l => l.nu === 'strong' ? 'OH⁻' : 'H₂O';

// ------------------------------------------------------------ molecule geometry
function slots(d, phase) {
  const r = Math.abs(d[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0];
  const e1 = norm(cross(d, r)), e2 = cross(d, e1);
  return [0, 1, 2].map(k => { const f = phase + k * 2 * Math.PI / 3; return norm(add(mul(d, 0.334), add(mul(e1, 0.943 * Math.cos(f)), mul(e2, 0.943 * Math.sin(f))))); });
}
// cfg: { subs, s (umbrella: +1 = away from Br side, −1 inverted), lg:{pos,style,vis}, nus:[{pos,side,type,style,vis,hLeave}], plus }
function build(cfg) {
  const atoms = [], bonds = [];
  const A = (el, p, o = {}) => { atoms.push({ el, p, alpha: 1, ...o }); return atoms.length - 1; };
  const B = (a, b, style = 'solid', o = {}) => bonds.push({ a, b, style, alpha: 1, ...o });
  const c = A('C', [0, 0, 0], { role: 'C' });
  const dirs = [0, 1, 2].map(k => { const th = k * 2 * Math.PI / 3; return norm([0.334 * cfg.s, 0.943 * Math.cos(th), 0.943 * Math.sin(th)]); });
  const grow = (type, pi, d, role) => {
    const pp = atoms[pi].p;
    if (type === 'H') { B(pi, A('H', add(pp, mul(d, 1.09)), { role })); return; }
    const ci = A('C', add(pp, mul(d, 1.54)), { role }); B(pi, ci);
    const sl = slots(d, role === 'g0' ? 0.5 : 1.2);
    if (type === 'Me') sl.forEach(sd => B(ci, A('H', add(atoms[ci].p, mul(sd, 1.09)))));
    if (type === 'Et') { grow('Me', ci, sl[0], role + 'b'); sl.slice(1).forEach(sd => B(ci, A('H', add(atoms[ci].p, mul(sd, 1.09))))); }
  };
  cfg.subs.forEach((type, k) => grow(type, c, dirs[k], 'g' + k));
  if (cfg.lg.vis > 0.01) {
    const i = A('Br', cfg.lg.pos, { role: 'LG', alpha: cfg.lg.vis, bonded: cfg.lg.style !== 'none', charge: cfg.lg.style === 'none' ? '−' : null });
    if (cfg.lg.style !== 'none') B(c, i, cfg.lg.style);
  }
  for (const nu of cfg.nus) {
    if (nu.vis <= 0.01) continue;
    const o = A('O', nu.pos, { role: 'NU', alpha: nu.vis, bonded: nu.style === 'solid', charge: nu.style === 'none' && nu.type === 'OH' ? '−' : null });
    if (nu.style !== 'none') B(c, o, nu.style, { alpha: nu.vis });
    B(o, A('H', add(nu.pos, mul(norm([nu.side * 0.35, 0.94, 0.1]), 0.96)), { alpha: nu.vis }), 'solid', { alpha: nu.vis });
    if (nu.type === 'H2O') {
      const hp = add(nu.pos, mul(norm([nu.side * 0.35, -0.5, 0.85]), 0.96 + nu.hLeave * 2.2));
      const hi = A('H', hp, { alpha: nu.vis * (1 - S(nu.hLeave, 0.6, 1)), charge: nu.hLeave > 0.25 ? '+' : null });
      if (nu.hLeave < 0.25) B(o, hi, 'solid', { alpha: nu.vis });
    }
  }
  return { atoms, bonds, dirs, s: cfg.s, plus: cfg.plus, subs: cfg.subs };
}
// geometry along the reaction coordinate xi ∈ [0,1]
function molCfg(sub, mech, xi, side = 1, nuType = 'OH', nuVis = 1, ghost = 0) {
  const subs = SUBS[sub];
  let s, lg, nus = [], plus = false;
  if (mech === 'SN2') {
    s = 1 - 2 * S(xi, 0.32, 0.66);
    const rBr = xi < 0.3 ? 1.94 : xi < 0.5 ? lerp(1.94, 2.35, S(xi, 0.3, 0.5)) : lerp(2.35, 6.0, S(xi, 0.5, 1));
    const rO = xi < 0.45 ? lerp(5.2, 2.1, S(xi, 0, 0.45)) : lerp(2.1, 1.43, S(xi, 0.45, 0.66));
    lg = { pos: [-rBr, 0, 0], style: xi < 0.33 ? 'solid' : xi < 0.6 ? 'dash' : 'none', vis: 1 };
    nus.push({ pos: [rO, 0, 0], side: 1, type: nuType, style: xi < 0.3 ? 'none' : xi < 0.6 ? 'dash' : 'solid', vis: nuVis, hLeave: 0 });
  } else {
    const rBr = lerp(1.94, 5.3, S(xi, 0.05, 0.35));
    lg = { pos: [-rBr, -(rBr - 1.94) * 0.45, 0], style: xi < 0.12 ? 'solid' : xi < 0.24 ? 'dash' : 'none', vis: 1 };
    s = (1 - S(xi, 0.12, 0.35)) - side * S(xi, 0.6, 0.8);
    plus = xi > 0.26 && xi < 0.66;
    if (ghost > 0) {
      const rg = lerp(5.2, 2.7, ghost);
      nus.push({ pos: [rg, 0, 0], side: 1, type: nuType, style: 'none', vis: 0.8 * nuVis, hLeave: 0 });
      nus.push({ pos: [-rg, 0, 0], side: -1, type: nuType, style: 'none', vis: 0.8 * nuVis, hLeave: 0 });
    } else {
      const rO = lerp(5.2, 1.43, S(xi, 0.45, 0.72));
      nus.push({ pos: [side * rO, 0, 0], side, type: nuType, style: xi < 0.6 ? 'none' : xi < 0.72 ? 'dash' : 'solid', vis: S(xi, 0.38, 0.46) * nuVis, hLeave: nuType === 'H2O' ? S(xi, 0.82, 1) : 0 });
    }
  }
  return { subs, s, lg, nus, plus };
}
// R/S from the actual 3D geometry: priority 1 = bonded Br or O, 2 = slot 0 (ethyl), 3 = slot 1 (methyl), 4 = H
function configOf(mol) {
  if (mol.subs.join() !== 'Et,Me,H' || Math.abs(mol.s) < 0.3) return null;
  const g1 = mol.atoms.find(a => (a.role === 'LG' || a.role === 'NU') && a.bonded);
  if (!g1) return null;
  return dot(cross(norm(g1.p), mol.dirs[0]), mol.dirs[1]) < 0 ? 'R' : 'S';
}

// ------------------------------------------------------------ projection + rendering
function proj(p, o) {
  const cy = Math.cos(o.yaw), sy = Math.sin(o.yaw), cp = Math.cos(o.pitch), sp = Math.sin(o.pitch);
  const x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy;
  const y2 = p[1] * cp - z1 * sp, z2 = p[1] * sp + z1 * cp, f = 16 / (16 - z2);
  return [o.cx + x1 * o.sc * f, o.cy - y2 * o.sc * f, z2, f];
}
function sketchOrder(mol) {
  const idx = mol.bonds.map((b, i) => i);
  return idx.sort((a, b) => (mol.bonds[a].a === 0 ? 0 : 1) - (mol.bonds[b].a === 0 ? 0 : 1));
}
const SKSHORT = { C: 0, H: 11, Br: 21, O: 14 };
function drawSketchMol(mol, scr, o) {
  const k = o.sc / 66, base = ctx.globalAlpha, order = sketchOrder(mol), firstBond = {};
  order.forEach((bi, n) => {
    const b = mol.bonds[bi], A = mol.atoms[b.a], Bt = mol.atoms[b.b], pa = scr[b.a], pb = scr[b.b];
    const pr = o.bondProg ? o.bondProg(n) : 1;
    if (firstBond[b.b] === undefined) firstBond[b.b] = pr;
    if (firstBond[b.a] === undefined) firstBond[b.a] = pr;
    if (pr <= 0) return;
    const L = Math.hypot(pb[0] - pa[0], pb[1] - pa[1]) || 1, ux = (pb[0] - pa[0]) / L, uy = (pb[1] - pa[1]) / L;
    const ra = SKSHORT[A.el] * k, rb = SKSHORT[Bt.el] * k;
    if (L < ra + rb + 4) return;
    const p1 = [pa[0] + ux * ra, pa[1] + uy * ra], p2 = [pb[0] - ux * rb, pb[1] - uy * rb];
    ctx.globalAlpha = base * b.alpha * A.alpha * Bt.alpha;
    const dz = pb[2] - pa[2];
    if (b.style === 'dash') sk([p1, p2], bi * 13 + 7, pr, { dash: [8 * k, 8 * k], single: true, w: 1.6 });
    else if (A.role === 'C' && Math.abs(dz) > 0.35 && pr >= 1) {
      const nx = -uy, ny = ux, w = 8 * k;
      if (dz > 0) {             // wedge: bond comes towards the viewer
        ctx.fillStyle = 'rgba(52,48,44,0.82)';
        ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0] + nx * w, p2[1] + ny * w); ctx.lineTo(p2[0] - nx * w, p2[1] - ny * w); ctx.closePath(); ctx.fill();
      } else {                  // hashed wedge: bond goes away
        for (let i = 1; i <= 7; i++) {
          const t = i / 7, cx = lerp(p1[0], p2[0], t), cy = lerp(p1[1], p2[1], t), h = w * t;
          sk([[cx + nx * h, cy + ny * h], [cx - nx * h, cy - ny * h]], bi * 31 + i, 1, { w: 1.4, single: true, amp: 0.4 });
        }
      }
    } else sk([p1, p2], bi * 13 + 7, pr, { w: 1.8 });
  });
  mol.atoms.forEach((a, i) => {
    if (a.el === 'C') return;
    const pr = o.bondProg ? clamp01((firstBond[i] ?? 1) * 2 - 1) : 1;
    if (pr <= 0) return;
    ctx.globalAlpha = base * a.alpha;
    const size = (a.el === 'H' ? 22 : a.el === 'Br' ? 30 : 28) * k;
    hand(a.el, scr[i][0], scr[i][1] + size * 0.33, { size, align: 'center', prog: pr, color: a.el === 'O' ? '#8e3a30' : INK });
  });
  ctx.globalAlpha = base;
}
function drawModelMol(mol, scr, o) {
  const base = ctx.globalAlpha, items = [];
  mol.bonds.forEach(b => items.push({ z: Math.min(scr[b.a][2], scr[b.b][2]) - 0.01, b }));
  mol.atoms.forEach((a, i) => items.push({ z: scr[i][2], a, i }));
  items.sort((p, q) => p.z - q.z);
  for (const it of items) {
    if (it.b) {
      const b = it.b, pa = scr[b.a], pb = scr[b.b], A = mol.atoms[b.a], Bt = mol.atoms[b.b];
      const w = 0.15 * o.sc * (pa[3] + pb[3]) / 2;
      ctx.globalAlpha = base * b.alpha * A.alpha * Bt.alpha;
      ctx.lineCap = 'round';
      if (b.style === 'dash') ctx.setLineDash([w * 1.1, w * 1.0]);
      ctx.strokeStyle = '#9d948a'; ctx.lineWidth = w * (b.style === 'dash' ? 0.8 : 1);
      ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke();
      ctx.strokeStyle = '#d4ccc1'; ctx.lineWidth = w * 0.3;
      ctx.beginPath(); ctx.moveTo(pa[0] - w * 0.18, pa[1] - w * 0.18); ctx.lineTo(pb[0] - w * 0.18, pb[1] - w * 0.18); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      const a = it.a, [x, y, , f] = scr[it.i], e = EL[a.el], R = e.r * o.sc * f;
      ctx.globalAlpha = base * a.alpha;
      const lab = a.el === 'Br' ? 'Br' : a.el === 'O' ? 'O' : '';
      sphere(x, y, R, e.col, lab, { shadow: false, labelColor: '#f6efe8', labelSize: Math.round(R * 0.75) });
    }
  }
  ctx.globalAlpha = base;
}
function drawCharges(mol, scr, o, alpha) {
  const base = ctx.globalAlpha; ctx.globalAlpha = base * alpha;
  mol.atoms.forEach((a, i) => {
    if (!a.charge || a.alpha < 0.2) return;
    const R = EL[a.el].r * o.sc * scr[i][3];
    hand(a.el === 'H' ? 'H⁺' : a.charge, scr[i][0] + R + 6, scr[i][1] - R * 0.6, { size: 30 * o.sc / 66, color: ORANGE, weight: 700 });
  });
  if (mol.plus) {
    const R = EL.C.r * o.sc * scr[0][3];
    hand('+', scr[0][0] + R + 2, scr[0][1] - R - 2, { size: 44 * o.sc / 66, color: ORANGE, weight: 700 });
  }
  ctx.globalAlpha = base;
}
function priorityPos(mol, scr, o) {
  const out = {};
  if (mol.subs.join() !== 'Et,Me,H') return out;
  mol.atoms.forEach((a, i) => {
    const R = EL[a.el].r * o.sc * scr[i][3] + 10;
    const p = [scr[i][0] + R * 0.8, scr[i][1] - R * 0.9];
    if ((a.role === 'LG' || a.role === 'NU') && a.bonded) out[1] = p;
    if (a.role === 'g0' && a.el === 'C') out[2] = p;
    if (a.role === 'g1' && a.el === 'C') out[3] = p;
    if (a.role === 'g2') out[4] = p;
  });

}
function drawPriorities(mol, scr, o, a) {
  if (a <= 0.01) return;
  const pos = priorityPos(mol, scr, o), base = ctx.globalAlpha; ctx.globalAlpha = base * a;
  for (const k in pos) {
    const [x, y] = pos[k];
    ctx.fillStyle = 'rgba(243,240,232,0.85)'; ctx.beginPath(); ctx.arc(x, y - 9, 15, 0, Math.PI * 2); ctx.fill();
    sk(ellipsePts(x, y - 9, 15, 15, 16), 700 + +k, 1, { w: 1.5, color: ORANGE, single: true, amp: 0.6 });
    hand(k, x, y + 1, { size: 26, color: ORANGE, align: 'center', weight: 700 });
  }
  ctx.globalAlpha = base;
  return pos;
}
function renderMol(mol, o) {
  const scr = mol.atoms.map(a => proj(a.p, o)), alpha = o.alpha ?? 1;
  if (alpha <= 0.01) return scr;
  const base = ctx.globalAlpha;
  if (o.m > 0.05) softEllipse(o.cx + 30, o.cy + 3.3 * o.sc, 3.6 * o.sc, 0.4 * o.sc, 0.16 * o.m * alpha);
  const skA = (1 - 0.82 * o.m) * alpha;
  if (skA > 0.01) { ctx.globalAlpha = base * skA; drawSketchMol(mol, scr, o); }
  if (o.m > 0.01) { ctx.globalAlpha = base * o.m * alpha; drawModelMol(mol, scr, o); }
  ctx.globalAlpha = base;
  drawCharges(mol, scr, o, alpha * (o.bondProg ? Lr(TT ?? 9, 4.0, 4.4) : 1));

}
function badge(x, y, letter, a, caption) {
  if (!letter || a <= 0.01) return;
  const base = ctx.globalAlpha; ctx.globalAlpha = base * a;
  sk(ellipsePts(x, y, 34, 34, 22), letter === 'R' ? 811 : 813, 1, { w: 2.2, color: ORANGE });
  hand(letter, x, y + 17, { size: 52, color: ORANGE, align: 'center', weight: 700 });
  if (caption) hand(caption, x, y + 66, { size: 22, color: GRAY, align: 'center' });
  ctx.globalAlpha = base;
}

// ------------------------------------------------------------ notebook views
function profileY(mech, x) {
  const base = lerp(0.32, 0.12, S(x, 0, 1));
  if (mech === 'SN2') return base + 0.58 * Math.exp(-(((x - 0.5) / 0.13) ** 2));
  return base + 0.56 * Math.exp(-(((x - 0.25) / 0.08) ** 2)) + 0.3 * S(x, 0.18, 0.28) * (1 - S(x, 0.66, 0.78)) + 0.16 * Math.exp(-(((x - 0.62) / 0.05) ** 2));
}
function drawProfile(a, mech, xi, prog) {
  if (a <= 0.01) return;
  const b = ctx.globalAlpha; ctx.globalAlpha = b * a;
  hand(`energy profile · ${mech}`, 1070, 205, { size: 40, prog: Math.min(1, prog * 3) });
  const { X, Y } = sketchAxes({ x0: 1100, y0: 290, x1: 1500, y1: 690 }, { xmin: 0, xmax: 1, ymin: 0, ymax: 1.2 },
    { xlabel: 'reaction progress →', ylabel: 'energy', prog: Math.min(1, prog * 2), seed: 951 });
  const pts = []; for (let i = 0; i <= 80; i++) { const x = i / 80; pts.push([X(x), Y(profileY(mech, x))]); }
  const cp = clamp01(prog * 1.4 - 0.3);
  sk(pts, mech === 'SN2' ? 961 : 963, cp, { w: 2.3 });
  if (cp >= 1) {
    const lab = (s, x, dy, o = {}) => hand(s, X(x), Y(profileY(mech, x)) + dy, { size: 24, align: 'center', ...o });
    lab('R–Br + Nu', 0.06, 34, { size: 21, color: GRAY });
    lab('R–Nu + Br⁻', 0.94, 34, { size: 21, color: GRAY });
    if (mech === 'SN2') {
      lab('TS', 0.5, -18, { color: ORANGE });
      lab('[Nu···C···Br]⁻', 0.5, -44, { size: 21, color: GRAY });
      hand('one step, one hump', 1110, 770, { size: 26, color: ORANGE });
      hand('rate = k [RX] [Nu]', 1110, 806, { size: 26, color: GRAY });
    } else {
      lab('TS₁ (slow)', 0.25, -18, { color: ORANGE, size: 22 });
      lab('C⁺', 0.45, 34, { color: ORANGE, size: 28 });
      lab('TS₂', 0.62, -16, { color: GRAY, size: 21 });
      hand('two steps · carbocation valley', 1110, 770, { size: 26, color: ORANGE });
      hand('slow step has only RX → rate = k [RX]', 1110, 806, { size: 24, color: GRAY });
    }
  }
  if (cp > 0.95) {
    const x = X(clamp01(xi)), y = Y(profileY(mech, clamp01(xi)));
    ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f3f0e8'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.globalAlpha = b;
}
function drawConfigView(a) {
  if (a <= 0.01) return;
  const b = ctx.globalAlpha; ctx.globalAlpha = b * a;
  hand('(R)-2-bromobutane', 1070, 205, { size: 40, prog: P(6.8, 7.6) });
  hand('CIP priorities', 1072, 262, { size: 26, color: GRAY, prog: P(7.4, 7.9) });
  const rows = [['1', 'Br', '(highest atomic number)'], ['2', 'C₂H₅', '(C, then its C beats H)'], ['3', 'CH₃', ''], ['4', 'H', '(lowest)']];
  rows.forEach(([k, g, why], i) => {
    const y = 318 + i * 52, p = P(7.8 + i * 0.35, 8.2 + i * 0.35);
    hand(k, 1086, y, { size: 32, color: ORANGE, weight: 700, prog: p });
    hand(g, 1120, y, { size: 32, prog: p });
    hand(why, 1215, y, { size: 22, color: GRAY, prog: p });
  });
  hand('turn H away from you:', 1072, 560, { size: 28, prog: P(9.4, 10) });
  hand('1 → 2 → 3 goes clockwise  →  R', 1072, 604, { size: 30, color: ORANGE, prog: P(10, 10.8) });
  ctx.globalAlpha = b;
}
function drawTrend(a) {
  if (a <= 0.01) return;
  const b = ctx.globalAlpha; ctx.globalAlpha = b * a;
  hand('which path?', 1070, 205, { size: 40, prog: P(41.5, 42.2) });
  const cols = [['CH₃X', 1, 0], ['1°', 0.75, 0.08], ['2°', 0.42, 0.42], ['3°', 0.03, 1]], base = 640, H = 290;
  sk([[1100, base], [1500, base]], 1201, P(41.8, 42.4), { w: 1.6 });
  cols.forEach(([lab, s2, s1], i) => {

    if (tipAfter) Studio.pencilTip = tipAfter;
  },
  stats: [{ id: 'M', label: 'MECHANISM' }, { id: 'R', label: 'RATE LAW' }, { id: 'P', label: 'PRODUCT' }, { id: 'I', label: 'INVERSION' }],
  statValues(st, mode, l) {
    const small = s => `<span style="font-size:11.5px">${s}</span>`;
    const mech = mode === 'lab' ? predicted(l) : st.mech;
    const nu = mode === 'lab' ? nuTxt(l) : (st.nuType === 'OH' ? 'OH⁻' : 'H₂O');
    const sub = mode === 'lab' ? l.sub : st.sub;
    let prod = '—', inv = '—';
    if (sub === 's') {
      if (mode === 'lab') {
        const n = l.tally.R + l.tally.S, p2 = pSN2(l);
        prod = n ? (Math.min(l.tally.R, l.tally.S) / n > 0.25 ? '(±)' : l.tally.S >= l.tally.R ? '(S)' : '(R)') : (mech === 'SN2' ? '(S)' : '(±)');
        inv = tallyText(l) || '~' + Math.round((p2 + (1 - p2) * 0.55) * 100) + ' %';
      } else if (mech === 'SN2' ? st.xi >= 0.6 : st.split > 0.5) { prod = mech === 'SN2' ? '(S)' : '(±)'; inv = mech === 'SN2' ? '100 %' : '~50 %'; }
    } else prod = small('achiral');
    return { M: mech === 'SN2' ? 'S<sub>N</sub>2' : 'S<sub>N</sub>1', R: small(mech === 'SN2' ? `k[RX][${nu}]` : 'k[RX]'), P: prod, I: inv };
  },
  now(st, l) {
    const p2 = pSN2(l), mech = predicted(l);
    const subT = { me: 'CH₃–Br has nothing blocking its back side, and CH₃⁺ is far too unstable to form, so it reacts only by SN2.',
      p: 'A primary carbon has an open back side and would form a poor 1° carbocation, so SN2 dominates.',
      s: 'A secondary carbon sits in the middle: the back side is partly crowded and the 2° carbocation is moderately stable, so the nucleophile and solvent decide.',
      t: 'Three groups completely block the back side (no SN2), but the 3° carbocation is very stable, so SN1 takes over.' }[l.sub];
    const nuT = l.nu === 'strong' ? 'OH⁻ is a strong nucleophile that pushes straight in (favours SN2).' : 'H₂O is a weak nucleophile; it waits for a carbocation to form (favours SN1).';
    const sT = l.solv === 'aprotic' ? 'Acetone does not cage the nucleophile, so it stays reactive (SN2).' : 'Water stabilises the carbocation and the leaving Br⁻ by hydrogen bonding (SN1).';
    let title = `${mech} favoured (${Math.round(Math.max(p2, 1 - p2) * 100)} %)`;
    const a = l.anim;
    if (a.running) {
      const stage = a.mech === 'SN2'
        ? (a.xi < 0.3 ? 'OH⁻ is approaching the back side.' : a.xi < 0.6 ? 'Transition state: C is half-bonded to O and Br.' : 'The umbrella has flipped; Br⁻ is leaving.')
        : (a.xi < 0.3 ? 'C–Br is breaking on its own (slow step).' : a.xi < 0.55 ? 'A flat carbocation has formed.' : `The nucleophile attacks from the ${a.side > 0 ? 'back' : 'front'} face.`);
      title = `Running ${a.mech}${l.batchLeft ? ` · molecule ${21 - l.batchLeft} of 20` : ''}`;
      return { title, text: stage + ' ' + subT, formula: a.mech === 'SN2' ? `rate = k[RX][${nuTxt(l)}]  ·  one step, inversion` : 'rate = k[RX]  ·  two steps via C⁺, racemisation' };
    }
    return { title, text: `${subT} ${nuT} ${sT}`, formula: mech === 'SN2' ? `rate = k[RX][${nuTxt(l)}]  ·  one step, inversion` : 'rate = k[RX]  ·  two steps via C⁺, racemisation' };
  },
  controls: [
    { type: 'segment', key: 'sub', label: 'Substrate', options: [['me', 'CH₃Br'], ['p', '1°'], ['s', '2°'], ['t', '3°']],
      note: 'methyl · primary · secondary · tertiary', onChange: l => resetRun(l) },
    { type: 'segment', key: 'nu', label: 'Nucleophile', options: [['strong', 'OH⁻ · strong'], ['weak', 'H₂O · weak']], onChange: l => resetRun(l) },
    { type: 'segment', key: 'solv', label: 'Solvent', options: [['aprotic', 'Acetone · aprotic'], ['protic', 'Water · protic']], onChange: l => resetRun(l) },
    { type: 'html', html: `<div class="eyebrow">Which path is favoured?</div>
        <div style="display:grid;grid-template-columns:34px 1fr 42px;gap:6px 8px;align-items:center;margin-top:8px;font-family:var(--mono);font-size:11.5px">
          <span>SN2</span><div style="height:10px;border-radius:5px;background:#eee8dd;overflow:hidden"><i data-b="2" style="display:block;height:100%;background:#2f55c8;opacity:.75;border-radius:5px;transition:width .3s"></i></div><b data-v="2"></b>
          <span>SN1</span><div style="height:10px;border-radius:5px;background:#eee8dd;overflow:hidden"><i data-b="1" style="display:block;height:100%;background:#a8433a;opacity:.75;border-radius:5px;transition:width .3s"></i></div><b data-v="1"></b>
        </div><div class="ends" style="margin-top:6px"><span>A TEACHING SCORE FROM SUBSTRATE, NUCLEOPHILE AND SOLVENT</span></div>`,
      update(box, l) {
        const p = pSN2(l), w2 = Math.round(p * 100) + '%', w1 = Math.round((1 - p) * 100) + '%';
        const b2 = box.querySelector('[data-b="2"]'), b1 = box.querySelector('[data-b="1"]');
        if (b2.style.width !== w2) { b2.style.width = w2; b1.style.width = w1; box.querySelector('[data-v="2"]').textContent = w2; box.querySelector('[data-v="1"]').textContent = w1; }
      } },
    { type: 'button', label: l => l.anim.running && !l.batchLeft ? 'Running…' : 'Run reaction', disabled: l => l.anim.running,
      onClick: l => startRun(l, false), chips: [{ key: 'slow', label: 'Slow motion' }, { key: 'pri', label: 'Show priorities' }] },
    { type: 'button', dark: false, label: l => l.batchLeft ? `Running… ${21 - l.batchLeft} / 20` : 'Run 20 molecules', disabled: l => l.anim.running,
      onClick: l => { l.tally = { R: 0, S: 0 }; l.batchLeft = 20; if (l.view === 'energy') l.view = 'products'; startRun(l, true); } },
    { type: 'slider', label: 'Sketch — Model', min: 0, max: 1, ends: ['SKETCH', 'MODEL'], get: l => l.m, set: (l, v) => { l.m = v; } },
    { type: 'segment', key: 'view', label: 'Notebook view', options: [['energy', 'Energy profile'], ['products', 'Products'], ['summary', 'Summary']] },
  ],
  challenges: [
    { id: 'inv', text: 'Get at least 95 % inversion from 20 molecules of the 2° substrate', hint: 'Make SN2 as strong as possible.', test: l => l.sub === 's' && l.tally.R + l.tally.S >= 20 && l.tally.S / (l.tally.R + l.tally.S) >= 0.95 },
    { id: 'rac', text: 'Make a racemic mixture (35–65 % S) from 20 molecules', hint: 'Which conditions push the 2° substrate towards SN1?', test: l => { const n = l.tally.R + l.tally.S; return l.sub === 's' && n >= 20 && l.tally.S / n > 0.35 && l.tally.S / n < 0.65; } },
    { id: 'fast', text: 'Find conditions where SN2 is at least 95 % favoured, and run it', hint: 'Unhindered carbon, strong nucleophile, aprotic solvent.', test: l => pSN2(l) >= 0.95 && l.completed > 0 },
    { id: 'block', text: 'React a substrate that cannot do SN2 at all', hint: 'Look at how crowded the back side is.', test: l => l.sub === 't' && l.completed > 0 },
  ],
  quiz: {
    question: 'If (R)-2-bromobutane reacted <b>only by SN1</b>, what would you get?',
    options: ['Only (S)-butan-2-ol', 'Only (R)-butan-2-ol', 'A racemic (±) mixture of both'], correct: 2,
    right: '✓ Right. The carbocation is flat, so water attacks the front and back faces about equally and the product is racemic (optically inactive). <b>Test it:</b> choose 2°, H₂O and water, then run 20 molecules.',
    wrong: '✗ Not quite. Complete inversion only happens in SN2, where there is no intermediate. In SN1 the flat carbocation can be attacked from either face.',
  },
});
})();
</script>
</body>
</html>
